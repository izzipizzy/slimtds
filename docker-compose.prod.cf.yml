services:
  app:
    environment:
      # No default: an absent DEPLOY_MODE used to fall back to cf_full, which serves
      # a plaintext origin while claiming TLS. Make the operator choose. cf_full is
      # not implemented and entrypoint.sh refuses it — see docs/DEPLOYMENT.md.
      DEPLOY_MODE: ${DEPLOY_MODE:?set DEPLOY_MODE=cf_flex in .env (cf_full is not implemented)}
      APP_ENV: prod
    ports:
      - "80:80"
      - "443:443"

  geoipupdate:
    image: maxmindinc/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: "GeoLite2-Country GeoLite2-City GeoLite2-ASN"
      GEOIPUPDATE_FREQUENCY: "24"
    volumes:
      - ./geoip-data:/usr/share/GeoIP
    networks:
      - slimtds
    restart: unless-stopped
